[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Technomancer"
version = "0.1.0"
description = "A RAG Pipeline for interacting with RPG documents"
readme = "README.md"
requires-python = ">=3.12.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "chromadb>=1.5.9",
    "gradio>=6.18.0",
    "langchain>=1.3.9",
    "langchain_chroma>=1.1.0",
    "langchain_community>=0.4.2",
    "langchain_core>=1.4.7",
    "langchain_ollama>=1.1.0",
    "langchain_text_splitters>=1.1.2",
    "ollama>=0.6.2",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.9",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.3",
    "rank_bm25>=0.2.2",
    "toml>=0.10.2",
    "unstructured[all-docs]>=0.23.1",
]


[project.urls]
Homepage = "https://github.com/ZefCo/Technomancer"
